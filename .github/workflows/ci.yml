name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Shared standard from the engineering playbook: ruff lint and format,
    # pytest on a Python version matrix, and a coverage gate.
    uses: ahmedoraby-eng/engineering-playbook/.github/workflows/reusable-python-ci.yml@main
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      coverage-package: dairy_platform
      coverage-min: 90
