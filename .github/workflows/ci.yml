name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Shared standard from the engineering playbook: clean install, then
    # typecheck + lint + format + build, tests with a 90% coverage gate,
    # and an audit of production dependencies. See ADR-004.
    uses: ahmedoraby-eng/engineering-playbook/.github/workflows/reusable-node-ci.yml@main
    with:
      node-version: "22"
      build-command: npm run check
      test-command: npm run test:coverage
