[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dairy-farm-management-platform"
version = "0.1.0"
description = "Multi-tenant SaaS foundation for dairy farm operations: feed management, inventory and integrations"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Errors, pyflakes, import order, modern syntax, bug-prone patterns, simplifications.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
